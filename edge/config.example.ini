# 复制成 config.ini 后按本节点填写。config.ini 含密码，不要提交到 git。

[device]
# 设备名，同时也是 RTDB 里的 trapId
device_id = MSU1

[firebase]
# 本节点专用的 Firebase Auth 账号（Email/Password）
email = msu1@devices.example.com
password = change-me
api_key = YOUR_WEB_API_KEY
db_url = https://YOUR_PROJECT-default-rtdb.firebaseio.com
bucket = YOUR_PROJECT.appspot.com
# 填 127.0.0.1 之类的地址就改连本地 Firebase Emulator；留空连云端
emulator_host =

[paths]
outbox = /home/paalab/swd/outbox
sent = /home/paalab/swd/sent
bad = /home/paalab/swd/bad
thumbs = /home/paalab/swd/thumbs
state = /home/paalab/swd/state
# 原图目录，最多占磁盘的 max_image_pct
images = /home/paalab/swd/images
# 温湿度和电压日志目录：YYYY-MM-DD.csv、voltage.csv、voltage_YYYY-MM.csv
sensor_logs = /home/paalab/swd/logs
# 计算剩余空间和原图占比用的磁盘（挂载点或其中任一路径）
disk = /home/paalab

[camera]
# rpicam-still --mode 的完整写法。64MP：9248:6944:12:P；16MP 按相机填
mode = 9248:6944:12:P
# 用 cam_test/calibration.py 标定得到的镜头位置
lens_position = 3.50

[model]
path = /home/paalab/swd/edge/model/best_ncnn_model
version = yolo11n_b8-ncnn-20260327

[storage]
max_image_pct = 60
sent_keep_days = 30
